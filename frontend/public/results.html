<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Transfer Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Sidebar toggle -->
    <div class="sidebar-toggle">
      <button id="historyToggle" class="button" type="button" aria-controls="historySidebar" aria-expanded="false">
        History
      </button>
    </div>

    <!-- Overlay + Sidebar -->
    <div id="overlay" class="overlay" hidden></div>

    <aside id="historySidebar" class="sidebar" aria-labelledby="historySidebarLabel" aria-hidden="true">
      <div class="sidebar-header">
        <div id="historySidebarLabel"><strong>History</strong></div>
        <button id="historyClose" class="button" type="button" aria-label="Close history">X</button>
      </div>

      <div class="sidebar-body">
        <div class="row wrap">
          <button id="refreshHistory" class="button" type="button">Refresh</button>
          <button id="clearHistory" class="button" type="button">Clear</button>
        </div>

        <div id="historyEmpty" class="history-empty" style="margin-top: 12px;">
          No sessions yet.
        </div>

        <div id="historyList" class="history-list" style="margin-top: 12px;"></div>
      </div>
    </aside>

    <main class="page">
      <div class="shell">
        <div class="row between" style="margin-bottom: 12px;">
          <h1>Transfer Results</h1>
          <a href="/" class="button">Home</a>
        </div>

        <section class="panel stack">
          <div id="summary"></div>
          <div id="takenBlock" class="stack"></div>
        </section>
      </div>
    </main>

      <script src="/js/results.js"></script>

  </body>
</html>
