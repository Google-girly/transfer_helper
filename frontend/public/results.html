<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Transfer Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared theme -->
    <link href="/style.css" rel="stylesheet">
  </head>

  <body>
    <div class="container my-5">
      <div class="card shadow-lg">
        <div class="card-body p-5">

          <h1 class="text-center mb-4">Transfer Results</h1>

          <div id="summary" class="mb-4"></div>

          <h2 class="h4 mb-3">Matches for Classes You've Taken</h2>
          <div id="takenBlock"></div>

          <div class="mt-4 text-center">
            <a href="/" class="btn btn-outline-primary">
              ← Back to Search
            </a>
          </div>

        </div>
      </div>
    </div>

    <script>
      function esc(s) {
        return String(s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function main() {
        const params = new URLSearchParams(window.location.search);
        const from = params.get("from");
        const to = params.get("to");

        const summary = document.getElementById("summary");
        const takenBlock = document.getElementById("takenBlock");

        if (!from || !to) {
          summary.innerHTML = `<div class="alert alert-warning">Missing school selection.</div>`;
          return;
        }

        let taken = [];
        try {
          taken = JSON.parse(localStorage.getItem("takenClasses") || "[]");
        } catch {}

        if (!taken.length) {
          summary.innerHTML = `
            <div class="alert alert-warning">
              No classes were entered on the home page.
            </div>`;
          return;
        }

        summary.innerHTML = `
          <div class="alert alert-info">
            Finding transfer matches…
          </div>`;

        try {
          const res = await fetch("http://localhost:8000/lookup_batch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              from,
              to,
              queries: taken,
              geListType: "CALGETC",
              geAcademicYearId: 76
            })
          });

          const data = await res.json();

          if (!res.ok) {
            summary.innerHTML = `
              <div class="alert alert-danger">
                ${esc(data.error || "Lookup failed")}
              </div>`;
            return;
          }

          summary.innerHTML = `
            <div class="result-item mb-4">
              <strong>From:</strong> ${esc(data.from_college)}<br/>
              <strong>To:</strong> ${esc(data.to_college)}<br/>
              <strong>Articulation Year:</strong> ${esc(data.academic_year || "N/A")}<br/>
              <strong>GE List:</strong> ${esc(data.geListType)}
            </div>
          `;

          takenBlock.innerHTML = (data.results || []).map(r => {
            if (!r.matches_count) {
              return `
                <div class="result-item mb-3">
                  <strong>Input:</strong> ${esc(r.query)}<br/>
                  <span class="text-muted">No match found.</span>
                </div>`;
            }

            const matches = r.matches.map(m => `
              <li class="list-group-item">
                <strong>${esc(m.from_course)}</strong> — ${esc(m.course_title)}<br/>
                <small class="text-muted">
                  Matched: ${esc(m.matched_equivalent.course)}
                  ${m.matched_equivalent.title ? " — " + esc(m.matched_equivalent.title) : ""}
                </small>

                ${
                  m.ge
                    ? `<div class="ge-info mt-2">
                        <strong>Transfer Areas:</strong>
                        ${esc((m.ge.transferAreas || []).join(", ") || "None")}<br/>
                        <strong>Approved:</strong>
                        ${m.ge.isCurrentlyApproved ? "Yes" : "No"}
                      </div>`
                    : ""
                }
              </li>
            `).join("");

            return `
              <div class="result-item mb-4">
                <strong>Input:</strong> ${esc(r.query)}
                <ul class="list-group mt-3">${matches}</ul>
              </div>`;
          }).join("");

        } catch (err) {
          summary.innerHTML = `
            <div class="alert alert-danger">
              Lookup failed. Check backend or console.
            </div>`;
        }
      }

      window.addEventListener("DOMContentLoaded", main);
    </script>
  </body>
</html>
