<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Results</title>
  </head>
  <body>
    <h1>Results</h1>

    <p id="summary"></p>

    <h2>Matches for classes you’ve taken</h2>
    <div id="takenBlock"></div>

    <p><a href="/">← Back</a></p>

    <script>
      function esc(s) {
        return String(s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function main() {
        const params = new URLSearchParams(window.location.search);
        const from = params.get("from");
        const to = params.get("to");

        const summary = document.getElementById("summary");
        const takenBlock = document.getElementById("takenBlock");

        if (!from || !to) {
          summary.textContent = "Missing school selection.";
          return;
        }

        // Pull taken classes from localStorage
        let taken = [];
        try {
          taken = JSON.parse(localStorage.getItem("takenClasses") || "[]");
          if (!Array.isArray(taken)) taken = [];
        } catch {
          taken = [];
        }

        if (!taken.length) {
          summary.innerHTML = `No classes were entered on the home page.`;
          takenBlock.innerHTML = `<p>Add classes on the home page and submit again.</p>`;
          return;
        }

        summary.textContent = "Finding matches...";

        try {
          const res = await fetch("http://localhost:8000/lookup_batch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ from, to, queries: taken })
          });

          const data = await res.json();

          if (!res.ok) {
            summary.innerHTML = `<span style="color:red;">${esc(data.error || "Lookup failed.")}</span>`;
            return;
          }

          summary.innerHTML = `
            <strong>From:</strong> ${esc(data.from_college)} (code ${esc(data.from_code)})<br/>
            <strong>To:</strong> ${esc(data.to_college)} (code ${esc(data.to_code)})<br/>
            <strong>Year:</strong> ${esc(data.academic_year || "N/A")}
          `;

          const blocks = (data.results || []).map(r => {
            if (!r.matches_count) {
              return `
                <div style="margin-bottom:14px;">
                  <div><strong>Input:</strong> ${esc(r.query)}</div>
                  <div style="color:#555;">No match found.</div>
                </div>
              `;
            }

            const list = r.matches.map(m => `
              <li style="margin-bottom: 8px;">
                <div><strong>${esc(m.from_course)}</strong> — ${esc(m.course_title)}</div>
                <div style="font-size:0.9em;color:#555;">
                  Matched: ${esc(m.matched_equivalent.course)}${m.matched_equivalent.title ? ` — ${esc(m.matched_equivalent.title)}` : ""}
                </div>
              </li>
            `).join("");

            return `
              <div style="margin-bottom:14px;">
                <div><strong>Input:</strong> ${esc(r.query)}</div>
                <ol>${list}</ol>
              </div>
            `;
          }).join("");

          takenBlock.innerHTML = blocks || "<p>No results.</p>";
        } catch (err) {
          console.error(err);
          summary.textContent = "Lookup failed (check backend / console).";
        }
      }

      window.addEventListener("DOMContentLoaded", main);
    </script>
  </body>
</html>
