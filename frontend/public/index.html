<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transfer Helper</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
  </head>

  <body>
    <!-- Sidebar toggle button -->
    <button class="history-toggle btn btn-light shadow-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#historySidebar" aria-controls="historySidebar">
      <i class="bi bi-layout-sidebar-inset"></i>
    </button>

    <!-- Offcanvas Sidebar -->
    <div class="offcanvas offcanvas-start history-offcanvas" tabindex="-1" id="historySidebar" aria-labelledby="historySidebarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="historySidebarLabel">
          <i class="bi bi-clock-history me-2"></i>History
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>

      <div class="offcanvas-body">
        <div class="d-flex gap-2 mb-3">
          <button id="refreshHistory" class="btn btn-outline-primary btn-sm w-100">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
          </button>
          <button id="clearHistory" class="btn btn-outline-danger btn-sm w-100">
            <i class="bi bi-trash me-1"></i> Clear
          </button>
        </div>

        <div id="historyEmpty" class="text-muted small d-none">
          No sessions yet. Run a lookup and it will appear here.
        </div>

        <div class="accordion" id="historyAccordion"></div>
      </div>
    </div>

    <!-- Main app -->
    <div class="container my-5 app-container">
      <div class="card shadow-lg">
        <div class="card-body p-5">

          <h1 class="text-center mb-2">Transfer Helper</h1>
          <p class="text-center text-muted mb-4">
            Check how your completed classes transfer between schools
          </p>

          <div class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i>
            Start typing a school name and choose from the list.
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">From School</label>
            <input id="fromInput" list="schoolsList" class="form-control form-control-lg" autocomplete="off">
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">To School</label>
            <input id="toInput" list="schoolsList" class="form-control form-control-lg" autocomplete="off">
          </div>

          <datalist id="schoolsList"></datalist>

          <div class="classes-section p-4 mb-4">
            <h2 class="h5 mb-2">Classes You've Taken</h2>
            <p class="text-muted mb-3">
              Enter course codes or titles (one per row).
            </p>

            <div id="rows"></div>

            <button id="addRow" class="btn btn-primary mt-2">
              <i class="bi bi-plus-lg"></i> Add another class
            </button>
          </div>

          <button id="submit" disabled class="btn btn-primary btn-lg w-100">
            Find Transfer Matches
          </button>

          <div id="warning" class="alert alert-warning mt-3 d-none"></div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function safeParseJSON(text) {
        try { return JSON.parse(text); } catch { return null; }
      }

      function esc(s) {
        return String(s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function sessionsKey() { return "transferSessions:v1"; }
      function pairKey(fromCode, toCode) { return String(fromCode) + "-" + String(toCode); }
      function matchesKey(fromCode, toCode) { return "transferMatches:v1:" + String(fromCode) + "-" + String(toCode); }

      function loadSessions() {
        try {
          const parsed = safeParseJSON(localStorage.getItem(sessionsKey()) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch { return {}; }
      }

      function saveSessions(obj) {
        try { localStorage.setItem(sessionsKey(), JSON.stringify(obj || {})); return true; }
        catch { return false; }
      }

      function loadMatches(fromCode, toCode) {
        try {
          const parsed = safeParseJSON(localStorage.getItem(matchesKey(fromCode, toCode)) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch { return {}; }
      }

      function normalizeClassStr(s) {
        return String(s || "").trim().replace(/\s+/g, " ");
      }

      function mergeUnique(existingArr, newArr) {
        const set = new Set((existingArr || []).map(normalizeClassStr).filter(Boolean));
        (newArr || []).map(normalizeClassStr).filter(Boolean).forEach(v => set.add(v));
        return Array.from(set);
      }

      function upsertSession(fromCode, toCode, fromName, toName, classes) {
        const sessions = loadSessions();
        const key = pairKey(fromCode, toCode);
        const now = Date.now();

        const prev = sessions[key] || {
          fromCode: String(fromCode),
          toCode: String(toCode),
          fromName: String(fromName || ""),
          toName: String(toName || ""),
          updatedAt: now,
          classes: []
        };

        sessions[key] = {
          fromCode: String(fromCode),
          toCode: String(toCode),
          fromName: String(fromName || prev.fromName || ""),
          toName: String(toName || prev.toName || ""),
          updatedAt: now,
          classes: mergeUnique(prev.classes, classes)
        };

        saveSessions(sessions);
      }

      function formatDateTime(ms) {
        try { return new Date(ms).toLocaleString(); }
        catch { return ""; }
      }

      function renderHistory() {
        const sessions = loadSessions();
        const keys = Object.keys(sessions || {});
        const accordion = document.getElementById("historyAccordion");
        const empty = document.getElementById("historyEmpty");

        keys.sort((a, b) => (sessions[b].updatedAt || 0) - (sessions[a].updatedAt || 0));

        accordion.innerHTML = "";
        empty.classList.toggle("d-none", keys.length !== 0);

        keys.forEach((k, idx) => {
          const s = sessions[k] || {};
          const fromCode = s.fromCode;
          const toCode = s.toCode;

          const fromName = s.fromName || fromCode;
          const toName = s.toName || toCode;
          const updated = formatDateTime(s.updatedAt || 0);

          const matches = loadMatches(fromCode, toCode);
          const matchedQueries = Object.keys(matches || {});

          const headingId = "histHeading" + idx;
          const collapseId = "histCollapse" + idx;

          const matchedListHtml = matchedQueries.length
            ? matchedQueries
                .sort((a, b) => ((matches[b] && matches[b].timestamp) || 0) - ((matches[a] && matches[a].timestamp) || 0))
                .map(q => {
                  const item = matches[q] || {};
                  const courses = (item.matchedCourses || []).slice(0, 8);
                  const extra = (item.matchedCourses || []).length > 8 ? "…" : "";
                  return `
                    <div class="history-item">
                      <div class="fw-semibold">${esc(q)}</div>
                      <div class="small text-muted">
                        ${courses.length ? ("Matched: " + esc(courses.join(", ")) + extra) : "Matched (saved)"}
                      </div>
                    </div>
                  `;
                })
                .join("")
            : `<div class="text-muted small">No matched classes saved yet for this pair.</div>`;

          accordion.insertAdjacentHTML("beforeend", `
            <div class="accordion-item history-accordion-item">
              <h2 class="accordion-header" id="${headingId}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="false" aria-controls="${collapseId}">
                  <div class="w-100">
                    <div class="history-title">
                      <span class="history-schools">${esc(fromName)} → ${esc(toName)}</span>
                    </div>
                    <div class="history-meta small text-muted">
                      Updated: ${esc(updated)}
                    </div>
                  </div>
                </button>
              </h2>

              <div id="${collapseId}" class="accordion-collapse collapse" aria-labelledby="${headingId}" data-bs-parent="#historyAccordion">
                <div class="accordion-body">
                  <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-sm btn-outline-primary w-100" data-load-session="1" data-from="${esc(fromCode)}" data-to="${esc(toCode)}">
                      <i class="bi bi-arrow-down-circle me-1"></i> Load
                    </button>
                    <button class="btn btn-sm btn-outline-secondary w-100" data-jump-results="1" data-from="${esc(fromCode)}" data-to="${esc(toCode)}">
                      <i class="bi bi-box-arrow-up-right me-1"></i> Results
                    </button>
                  </div>

                  <div class="small text-muted mb-2">
                    Classes in this session: <strong>${(s.classes || []).length}</strong>
                  </div>

                  <div class="fw-bold mb-2">Matched Classes (Saved)</div>
                  <div class="history-list">
                    ${matchedListHtml}
                  </div>
                </div>
              </div>
            </div>
          `);
        });

        // Hook actions
        accordion.querySelectorAll("[data-load-session='1']").forEach(btn => {
          btn.addEventListener("click", () => {
            const fromCode = btn.getAttribute("data-from");
            const toCode = btn.getAttribute("data-to");
            const sessions = loadSessions();
            const s = sessions[pairKey(fromCode, toCode)];
            if (!s) return;

            document.getElementById("fromInput").value = s.fromName || "";
            document.getElementById("toInput").value = s.toName || "";

            const rowsEl = document.getElementById("rows");
            rowsEl.innerHTML = "";
            const cls = (s.classes || []).slice(0, 30);
            const minRows = Math.max(3, cls.length || 3);
            for (let i = 0; i < minRows; i++) createRow(rowsEl, cls[i] || "");

            const offcanvasEl = document.getElementById("historySidebar");
            const oc = bootstrap.Offcanvas.getInstance(offcanvasEl);
            if (oc) oc.hide();

            validate();
          });
        });

        accordion.querySelectorAll("[data-jump-results='1']").forEach(btn => {
          btn.addEventListener("click", () => {
            const fromCode = btn.getAttribute("data-from");
            const toCode = btn.getAttribute("data-to");
            const sessions = loadSessions();
            const s = sessions[pairKey(fromCode, toCode)];
            const classes = (s && s.classes) ? s.classes : [];
            try { localStorage.setItem("takenClasses", JSON.stringify(classes)); } catch {}
            window.location.href = `/results?from=${encodeURIComponent(fromCode)}&to=${encodeURIComponent(toCode)}`;
          });
        });
      }

      let nameToCode = new Map();

      function setWarning(msg) {
        const warning = document.getElementById("warning");
        warning.textContent = msg || "";
        warning.classList.toggle("d-none", !msg);
      }

      function getSelectedCode(inputEl) {
        return nameToCode.get(String(inputEl.value || "").trim()) || "";
      }

      function validate() {
        const submit = document.getElementById("submit");
        const fromInput = document.getElementById("fromInput");
        const toInput = document.getElementById("toInput");
        submit.disabled = !getSelectedCode(fromInput) || !getSelectedCode(toInput);
      }

      function createRow(rowsEl, value) {
        const row = document.createElement("div");
        row.className = "class-row mb-2";
        row.innerHTML = `
          <input class="form-control" placeholder="e.g. HORT 53 or Soil Science" value="${esc(value)}">
          <button class="btn btn-danger">Remove</button>
        `;
        row.querySelector("button").onclick = () => row.remove();
        rowsEl.appendChild(row);
      }

      async function init() {
        const fromInput = document.getElementById("fromInput");
        const toInput = document.getElementById("toInput");
        const list = document.getElementById("schoolsList");
        const rowsEl = document.getElementById("rows");

        for (let i = 0; i < 3; i++) createRow(rowsEl, "");

        document.getElementById("addRow").onclick = () => createRow(rowsEl, "");

        // Fetch schools
        try {
          const res = await fetch("http://localhost:8000/schools");
          const schools = await res.json();

          schools.forEach(s => {
            nameToCode.set(s.schoolName, String(s.code));
            const opt = document.createElement("option");
            opt.value = s.schoolName;
            list.appendChild(opt);
          });
        } catch {
          setWarning("Could not load schools. Is the backend running on http://localhost:8000 ?");
        }

        // Sidebar events
        const historyEl = document.getElementById("historySidebar");
        historyEl.addEventListener("show.bs.offcanvas", renderHistory);

        document.getElementById("refreshHistory").onclick = renderHistory;
        document.getElementById("clearHistory").onclick = () => {
          try {
            localStorage.removeItem("transferSessions:v1");
            Object.keys(localStorage).forEach(k => {
              if (String(k).startsWith("transferMatches:v1:")) localStorage.removeItem(k);
            });
          } catch {}
          renderHistory();
        };

        fromInput.oninput = validate;
        toInput.oninput = validate;

        document.getElementById("submit").onclick = () => {
          const fromCode = getSelectedCode(fromInput);
          const toCode = getSelectedCode(toInput);

          if (!fromCode || !toCode) {
            setWarning("Please select valid schools from the list.");
            return;
          }

          const classes = [...rowsEl.querySelectorAll("input")]
            .map(i => normalizeClassStr(i.value))
            .filter(Boolean);

          try { localStorage.setItem("takenClasses", JSON.stringify(classes)); } catch {}

          // Update the same session for same from/to
          upsertSession(fromCode, toCode, fromInput.value.trim(), toInput.value.trim(), classes);

          window.location.href = `/results?from=${encodeURIComponent(fromCode)}&to=${encodeURIComponent(toCode)}`;
        };

        validate();
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
