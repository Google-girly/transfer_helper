<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transfer Helper</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
  </head>

  <body>
    <div class="container my-5 app-container">
      <div class="card shadow-lg">
        <div class="card-body p-5">

          <h1 class="text-center mb-2">Transfer Helper</h1>
          <p class="text-center text-muted mb-4">
            Check how your completed classes transfer between schools
          </p>

          <div class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i>
            Start typing a school name and choose from the list.
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">From School</label>
            <input id="fromInput" list="schoolsList" class="form-control form-control-lg" autocomplete="off">
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">To School</label>
            <input id="toInput" list="schoolsList" class="form-control form-control-lg" autocomplete="off">
          </div>

          <datalist id="schoolsList"></datalist>

          <div class="classes-section p-4 mb-4">
            <h2 class="h5 mb-2">Classes You've Taken</h2>
            <p class="text-muted mb-3">
              Enter course codes or titles (one per row).
            </p>

            <div id="rows"></div>

            <button id="addRow" class="btn btn-primary mt-2">
              <i class="bi bi-plus-lg"></i> Add another class
            </button>
          </div>

          <button id="submit" disabled class="btn btn-primary btn-lg w-100">
            Find Transfer Matches
          </button>

          <div id="warning" class="alert alert-warning mt-3 d-none"></div>

        </div>
      </div>
    </div>

    <script>
      async function init() {
        const fromInput = document.getElementById("fromInput");
        const toInput = document.getElementById("toInput");
        const list = document.getElementById("schoolsList");
        const submit = document.getElementById("submit");
        const warning = document.getElementById("warning");
        const rowsEl = document.getElementById("rows");
        const addRowBtn = document.getElementById("addRow");

        const nameToCode = new Map();

        function setWarning(msg) {
          warning.textContent = msg;
          warning.classList.toggle("d-none", !msg);
        }

        function getSelectedCode(input) {
          return nameToCode.get(input.value.trim()) || "";
        }

        function validate() {
          submit.disabled = !getSelectedCode(fromInput) || !getSelectedCode(toInput);
        }

        function createRow() {
          const row = document.createElement("div");
          row.className = "class-row mb-2";

          row.innerHTML = `
            <input class="form-control" placeholder="e.g. HORT 53 or Soil Science">
            <button class="btn btn-danger">Remove</button>
          `;

          row.querySelector("button").onclick = () => row.remove();
          rowsEl.appendChild(row);
        }

        for (let i = 0; i < 3; i++) createRow();
        addRowBtn.onclick = createRow;

        const res = await fetch("http://localhost:8000/schools");
        const schools = await res.json();

        schools.forEach(s => {
          nameToCode.set(s.schoolName, String(s.code));
          const opt = document.createElement("option");
          opt.value = s.schoolName;
          list.appendChild(opt);
        });

        fromInput.oninput = validate;
        toInput.oninput = validate;

        submit.onclick = () => {
          const classes = [...rowsEl.querySelectorAll("input")]
            .map(i => i.value.trim())
            .filter(Boolean);

          localStorage.setItem("takenClasses", JSON.stringify(classes));

          window.location.href =
            `/results?from=${getSelectedCode(fromInput)}&to=${getSelectedCode(toInput)}`;
        };
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
