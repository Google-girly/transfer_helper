<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>School Transfer</title>
  </head>
  <body>
    <h1>School Transfer</h1>

    <label>
      From:
      <select id="from">
        <option value="">Loading...</option>
      </select>
    </label>

    <br /><br />

    <label>
      To:
      <select id="to">
        <option value="">Loading...</option>
      </select>
    </label>

    <br /><br />

    <button id="submit" disabled>Submit</button>
    <p id="warning" style="color:red;"></p>

    <script>
      async function loadSchools() {
        const from = document.getElementById("from");
        const to = document.getElementById("to");
        const submit = document.getElementById("submit");
        const warning = document.getElementById("warning");

        function validate() {
          warning.textContent = "";
          submit.disabled = true;

          if (!from.value || !to.value) return;

          if (from.value === to.value) {
            warning.textContent = "From and To schools must be different.";
            return;
          }

          submit.disabled = false;
        }

        try {
          const res = await fetch("http://localhost:8000/schools");
          const schools = await res.json();

          schools.sort((a, b) =>
            (a.schoolName || "").localeCompare(b.schoolName || "")
          );

          from.innerHTML = '<option value="">Select a school...</option>';
          to.innerHTML = '<option value="">Select a school...</option>';

          schools.forEach((s) => {
            const opt1 = document.createElement("option");
            opt1.value = s.code;
            opt1.textContent = s.schoolName;

            const opt2 = opt1.cloneNode(true);

            from.appendChild(opt1);
            to.appendChild(opt2);
          });

          from.addEventListener("change", validate);
          to.addEventListener("change", validate);

          submit.onclick = () => {
            const url = `/results?from=${from.value}&to=${to.value}`;
            window.location.href = url;
          };
        } catch (err) {
          warning.textContent = "Failed to load schools.";
        }
      }

      window.addEventListener("DOMContentLoaded", loadSchools);
    </script>
  </body>
</html>
