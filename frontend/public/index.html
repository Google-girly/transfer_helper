<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transfer Helper</title>
    <link href="/style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Sidebar toggle -->
    <div class="sidebar-toggle">
      <button id="historyToggle" class="button" type="button" aria-controls="historySidebar" aria-expanded="false">
        History
      </button>
    </div>

    <!-- Overlay + Sidebar -->
    <div id="overlay" class="overlay" hidden></div>

    <aside id="historySidebar" class="sidebar" aria-labelledby="historySidebarLabel" aria-hidden="true">
      <div class="sidebar-header">
        <div id="historySidebarLabel"><strong>History</strong></div>
        <button id="historyClose" class="button" type="button" aria-label="Close history">X</button>
      </div>

      <div class="sidebar-body">
        <div class="row wrap">
          <button id="refreshHistory" class="button" type="button">Refresh</button>
          <button id="clearHistory" class="button" type="button">Clear</button>
        </div>

        <div id="historyEmpty" class="history-empty" style="margin-top: 12px;">
          No sessions yet.
        </div>

        <div id="historyList" class="history-list" style="margin-top: 12px;"></div>
      </div>
    </aside>

    <main class="page">
      <div class="shell">
        <section class="panel stack">
          <div class="stack">
            <h1>Transfer Helper</h1>
            <div class="small">Pick two schools, enter classes, view results.</div>
          </div>

          <div class="stack">
            <div>
              <label for="fromInput">From School</label>
              <input id="fromInput" class="input" list="schoolsList" autocomplete="off" />
            </div>

            <div>
              <label for="toInput">To School</label>
              <input id="toInput" class="input" list="schoolsList" autocomplete="off" />
            </div>

            <datalist id="schoolsList"></datalist>

            <div class="panel stack">
              <div class="row between">
                <div>
                  <h2>Classes You’ve Taken</h2>
                  <div class="help">Example: HORT 53</div>
                </div>
                <button id="addRow" class="button" type="button">Add row</button>
              </div>

              <div id="rows" class="stack"></div>
            </div>

            <div id="warning" class="notice" style="display:none;"></div>

            <div class="row end">
              <button id="submit" class="button" type="button" disabled>See Results</button>
            </div>
          </div>
        </section>
      </div>
    </main>

  <script src="/js/index.js"></script>
  </body>
</html>
