<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>School Transfer</title>
  </head>
  <body>
    <h1>School Transfer</h1>

    <p><strong>Tip:</strong> Start typing a school name and pick from the suggestions.</p>

    <label>
      From:
      <input id="fromInput" list="schoolsList" placeholder="Type a school..." style="width: 420px;" />
    </label>

    <br /><br />

    <label>
      To:
      <input id="toInput" list="schoolsList" placeholder="Type a school..." style="width: 420px;" />
    </label>

    <datalist id="schoolsList"></datalist>

    <br /><br />

    <h2>Classes you’ve taken at the “From” school</h2>
    <p style="margin-top:0;">
      Add one class per row. You can enter either a course code (e.g. <strong>HORT 53</strong>)
      or a course title (e.g. <strong>Soil Science and Management</strong>).
    </p>

    <div id="rows"></div>

    <button id="addRow" type="button">+ Add another class</button>

    <br /><br />

    <button id="submit" disabled>Submit</button>
    <p id="warning" style="color:red;"></p>

    <script>
      async function init() {
        const fromInput = document.getElementById("fromInput");
        const toInput = document.getElementById("toInput");
        const list = document.getElementById("schoolsList");
        const submit = document.getElementById("submit");
        const warning = document.getElementById("warning");

        const rowsEl = document.getElementById("rows");
        const addRowBtn = document.getElementById("addRow");

        // Save schools in a map: exact schoolName -> code
        const nameToCode = new Map();

        function setWarning(msg) {
          warning.textContent = msg || "";
        }

        function getSelectedCode(inputEl) {
          const name = (inputEl.value || "").trim();
          return nameToCode.get(name) || "";
        }

        function validate() {
          setWarning("");
          submit.disabled = true;

          const fromCode = getSelectedCode(fromInput);
          const toCode = getSelectedCode(toInput);

          if (!fromCode || !toCode) return;

          if (fromCode === toCode) {
            setWarning("From and To schools must be different.");
            return;
          }

          submit.disabled = false;
        }

        function createRow(initialValue = "") {
          const row = document.createElement("div");
          row.style.marginBottom = "8px";

          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "e.g. HORT 53";
          input.style.width = "320px";
          input.value = initialValue;

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.textContent = "Remove";
          removeBtn.style.marginLeft = "8px";

          removeBtn.onclick = () => {
            row.remove();
            // Always keep at least 1 row
            if (!rowsEl.querySelector("input")) createRow("");
          };

          row.appendChild(input);
          row.appendChild(removeBtn);
          rowsEl.appendChild(row);

          return input;
        }

        function getClassesFromRows() {
          const inputs = Array.from(rowsEl.querySelectorAll("input"));
          return inputs
            .map(i => (i.value || "").trim())
            .filter(Boolean)
            .slice(0, 50);
        }

        // Start with 3 rows (easy UX)
        createRow("");
        createRow("");
        createRow("");

        addRowBtn.onclick = () => createRow("");

        try {
          const res = await fetch("http://localhost:8000/schools");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const schools = await res.json();

          schools
            .filter(s => s && s.schoolName && s.code !== undefined)
            .sort((a, b) => (a.schoolName || "").localeCompare(b.schoolName || ""))
            .forEach(s => {
              nameToCode.set(s.schoolName, String(s.code));
              const opt = document.createElement("option");
              opt.value = s.schoolName;
              list.appendChild(opt);
            });

          fromInput.addEventListener("input", validate);
          toInput.addEventListener("input", validate);

          submit.addEventListener("click", () => {
            const fromCode = getSelectedCode(fromInput);
            const toCode = getSelectedCode(toInput);

            if (!fromCode || !toCode) {
              setWarning("Please pick schools from the suggestions list.");
              return;
            }
            if (fromCode === toCode) {
              setWarning("From and To schools must be different.");
              return;
            }

            const classes = getClassesFromRows();
            localStorage.setItem("takenClasses", JSON.stringify(classes));

            window.location.href =
              `/results?from=${encodeURIComponent(fromCode)}&to=${encodeURIComponent(toCode)}`;
          });
        } catch (err) {
          console.error(err);
          setWarning("Failed to load schools.");
        }
      }

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
