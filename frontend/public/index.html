<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>School Transfer</title>
  </head>
  <body>
    <h1>School Transfer</h1>

    <label>
      From:
      <select id="from">
        <option value="">Loading...</option>
      </select>
    </label>

    <br /><br />

    <label>
      To:
      <select id="to">
        <option value="">Loading...</option>
      </select>
    </label>

    <br /><br />

    <button id="submit" disabled>Submit</button>

    <p id="warning" style="color:red;"></p>

    <pre id="output"></pre>

    <script>
      async function loadSchools() {
        const from = document.getElementById("from");
        const to = document.getElementById("to");
        const submit = document.getElementById("submit");
        const output = document.getElementById("output");
        const warning = document.getElementById("warning");

        try {
          const res = await fetch("http://localhost:8000/schools");
          if (!res.ok) throw new Error("HTTP " + res.status);

          const schools = await res.json();

          schools.sort((a, b) =>
            (a.schoolName || "").localeCompare(b.schoolName || "")
          );

          from.innerHTML = '<option value="">Select a school...</option>';
          to.innerHTML = '<option value="">Select a school...</option>';

          schools.forEach((s) => {
            if (!s.schoolName) return;

            const opt1 = document.createElement("option");
            opt1.value = s.code;
            opt1.textContent = s.schoolName;

            const opt2 = opt1.cloneNode(true);

            from.appendChild(opt1);
            to.appendChild(opt2);
          });

          function validate() {
            output.textContent = "";
            warning.textContent = "";

            if (!from.value || !to.value) {
              submit.disabled = true;
              return;
            }

            if (from.value === to.value) {
              submit.disabled = true;
              warning.textContent =
                "From and To schools must be different.";
              return;
            }

            submit.disabled = false;
          }

          from.addEventListener("change", validate);
          to.addEventListener("change", validate);

          submit.onclick = () => {
            const fromName = from.options[from.selectedIndex].text;
            const fromCode = from.value;

            const toName = to.options[to.selectedIndex].text;
            const toCode = to.value;

            output.textContent =
              `FROM:\n` +
              `  Name: ${fromName}\n` +
              `  Code: ${fromCode}\n\n` +
              `TO:\n` +
              `  Name: ${toName}\n` +
              `  Code: ${toCode}`;
          };
        } catch (err) {
          console.error("Failed to load schools:", err);
          warning.textContent = "Failed to load schools.";
        }
      }

      window.addEventListener("DOMContentLoaded", loadSchools);
    </script>
  </body>
</html>
